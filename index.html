<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="商人之眼">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0a0c10">
    <meta name="description" content="输入任何商业观察，AI自动运行全套思维框架——广告拆解、店铺诊断、利润感知、供需挖掘、用户画像、资金判断、信息提炼。">
    <meta name="keywords" content="商业分析,AI分析,商业思维,广告拆解,店铺诊断,用户画像">
    <!-- Open Graph / WeChat Share -->
    <meta property="og:title" content="商人之眼 — AI商业分析引擎">
    <meta property="og:description" content="输入广告、店铺、商品、消费、新闻——AI自动运行全套商业思维框架，输出深度解读。">
    <meta property="og:type" content="website">
    <meta property="og:image" content="">
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="商人之眼 — AI商业分析引擎">
    <meta name="twitter:description" content="输入任何商业观察，AI自动运行全套思维框架，输出深度解读与行动方案。">
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <title>商人之眼 — AI商业分析引擎</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Source+Sans+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root{--bg:#0a0c10;--bg2:#13161c;--bg3:#0e1018;--bg4:#1a1e28;--bd:#222738;--bd2:#3a4060;--tx:#d4d0c8;--tx2:#7a7568;--tx3:#4a4640;--gold:#c8a84e;--gd:#8a7338;--gg:rgba(200,168,78,.08);--gn:#5a9a6e;--rd:#b85a5a;--bl:#5a7a9a;--am:#d4a574;--fd:'Cormorant Garamond',serif;--fb:'Source Sans Pro',sans-serif}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:var(--fb);background:var(--bg);color:var(--tx);min-height:100vh}
        body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 15% 30%,rgba(200,168,78,.02) 0%,transparent 50%),radial-gradient(ellipse at 85% 70%,rgba(90,122,154,.02) 0%,transparent 50%);pointer-events:none;z-index:0}
        .app{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:24px 20px 80px}

        /* Modal */
        .mo{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
        .mo.open{display:flex}
        .mc{background:var(--bg2);border:1px solid var(--bd);border-radius:16px;padding:32px;width:90%;max-width:500px}
        .mc h3{font-family:var(--fd);font-size:1.3rem;color:var(--gold);margin-bottom:6px}
        .mc p{color:var(--tx2);font-size:.86rem;margin-bottom:20px;line-height:1.7}
        .sg{margin-bottom:16px}
        .sg label{display:block;font-size:.76rem;font-weight:600;color:var(--tx2);margin-bottom:5px;text-transform:uppercase;letter-spacing:1px}
        .si,.ss{width:100%;padding:11px 14px;background:var(--bg3);border:1px solid var(--bd);border-radius:8px;color:var(--tx);font-family:var(--fb);font-size:.9rem;transition:border .2s}
        .si:focus,.ss:focus{outline:none;border-color:var(--gd);box-shadow:0 0 0 3px var(--gg)}
        .sh{font-size:.72rem;color:var(--tx3);margin-top:3px}
        .sr{display:flex;gap:12px;align-items:end}
        .sr .sg{flex:1}
        .bt{padding:10px 18px;border-radius:8px;background:var(--gold);color:var(--bg);border:none;font-weight:700;cursor:pointer;font-size:.82rem;white-space:nowrap}
        .bt:hover{background:#d4b55a}
        .bt:disabled{opacity:.5;cursor:not-allowed}
        .sd{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
        .sd.ok{background:var(--gn)}.sd.fl{background:var(--rd)}.sd.off{background:var(--tx3)}
        .st{font-size:.8rem;color:var(--tx2)}

        /* Header */
        .hd{text-align:center;margin-bottom:36px;padding:32px 0 28px;position:relative}
        .logo{font-family:var(--fd);font-size:2.4rem;font-weight:700;color:var(--gold);letter-spacing:3px}
        .sub{font-size:.72rem;color:var(--tx2);letter-spacing:5px;text-transform:uppercase;margin-top:3px}
        .desc{color:var(--tx2);font-size:.88rem;margin-top:12px;max-width:560px;margin-left:auto;margin-right:auto;line-height:1.8;font-style:italic}
        .cbtn{position:absolute;top:32px;right:0;background:var(--bg4);border:1px solid var(--bd);color:var(--tx2);padding:7px 14px;border-radius:8px;cursor:pointer;font-size:.8rem;font-family:var(--fb);transition:all .2s}
        .cbtn:hover{border-color:var(--gd);color:var(--gold)}
        .cbtn .d{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;vertical-align:middle}
        .cbtn .d.on{background:var(--gn)}.cbtn .d.off{background:var(--rd)}

        /* Unified Input */
        .input-area{background:var(--bg2);border:1px solid var(--bd);border-radius:16px;padding:24px;margin-bottom:24px;transition:border .2s}
        .input-area:focus-within{border-color:var(--gd)}
        .input-main{width:100%;min-height:180px;padding:16px;background:transparent;border:none;color:var(--tx);font-family:var(--fb);font-size:.95rem;line-height:1.8;resize:vertical;outline:none}
        .input-main::placeholder{color:var(--tx3)}
        .input-tools{display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap}
        .tool-btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:20px;font-size:.8rem;color:var(--tx2);background:var(--bg3);border:1px solid var(--bd);cursor:pointer;transition:all .15s;font-family:var(--fb)}
        .tool-btn:hover{border-color:var(--gd);color:var(--gold);background:var(--gg)}
        .go-btn{padding:14px 32px;border-radius:10px;background:var(--gold);color:var(--bg);border:none;font-family:var(--fb);font-size:.95rem;font-weight:700;cursor:pointer;transition:all .2s;letter-spacing:.5px;margin-top:20px;width:100%}
        .go-btn:hover{background:#d4b55a;transform:translateY(-1px);box-shadow:0 4px 20px rgba(200,168,78,.25)}
        .go-btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}

        /* Attachments */
        .attachments{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
        .att{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;background:var(--bg4);border:1px solid var(--bd);border-radius:10px;font-size:.82rem;color:var(--tx2)}
        .att img{width:40px;height:40px;object-fit:cover;border-radius:6px}
        .att .rm{cursor:pointer;color:var(--rd);font-weight:700;margin-left:4px}
        .att .rm:hover{color:#d88}
        .att .link{color:var(--bl);word-break:break-all;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

        /* Output */
        .output{background:var(--bg2);border:1px solid var(--bd);border-radius:16px;overflow:hidden;display:none}
        .output.show{display:block;animation:up .3s ease}
        @keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
        .out-h{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid var(--bd);background:rgba(200,168,78,.03)}
        .out-h span{font-size:.76rem;color:var(--tx2);font-weight:600;text-transform:uppercase;letter-spacing:1px}
        .out-b{padding:24px;max-height:75vh;overflow-y:auto;font-size:.9rem;line-height:1.9}
        .out-b::-webkit-scrollbar{width:4px}
        .out-b::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:2px}

        /* Markdown */
        .md h1,.md h2,.md h3{font-family:var(--fd);color:var(--gold);margin:22px 0 10px;letter-spacing:.5px}
        .md h1{font-size:1.3rem;border-bottom:1px solid var(--bd);padding-bottom:8px}
        .md h2{font-size:1.15rem}
        .md h3{font-size:1rem;color:var(--tx)}
        .md h4{font-size:.92rem;color:var(--am);margin:14px 0 5px;font-weight:700}
        .md p{margin:7px 0;color:var(--tx2)}
        .md ul,.md ol{margin:7px 0 7px 20px;color:var(--tx2)}
        .md li{margin:4px 0;line-height:1.8}
        .md strong{color:var(--tx);font-weight:700}
        .md em{color:var(--am)}
        .md code{background:var(--bg4);padding:2px 6px;border-radius:4px;font-size:.84rem;color:var(--gold)}
        .md blockquote{border-left:3px solid var(--gd);padding:8px 16px;margin:12px 0;background:var(--gg);border-radius:0 8px 8px 0}
        .md blockquote p{color:var(--tx2);margin:3px 0}
        .md hr{border:none;border-top:1px solid var(--bd);margin:18px 0}
        .md table{width:100%;border-collapse:collapse;margin:12px 0;font-size:.86rem}
        .md th{text-align:left;padding:9px 11px;font-weight:700;color:var(--gold);border-bottom:2px solid var(--bd);font-size:.76rem;text-transform:uppercase}
        .md td{padding:9px 11px;border-bottom:1px solid var(--bd);color:var(--tx2)}
        .md tr:hover td{background:var(--bg4)}

        /* Loading */
        .ld{display:flex;align-items:center;gap:12px;padding:40px 0;color:var(--tx2)}
        .ld-d{display:flex;gap:4px}
        .ld-d span{width:6px;height:6px;border-radius:50%;background:var(--gold);animation:bk 1.4s infinite both}
        .ld-d span:nth-child(2){animation-delay:.2s}.ld-d span:nth-child(3){animation-delay:.4s}
        @keyframes bk{0%,80%,100%{opacity:.2}40%{opacity:1}}
        .ld-t{font-size:.76rem;color:var(--tx3);margin-top:5px}

        /* Footer */
        .ft{text-align:center;padding:40px 0 0;color:var(--tx3);font-size:.7rem;letter-spacing:2px;border-top:1px solid var(--bd);margin-top:40px}

        /* Voice & Camera */
        .voice-btn{position:relative;overflow:hidden}
        .voice-btn.rec{border-color:var(--rd);color:var(--rd);animation:pulse-rd 1.2s infinite}
        @keyframes pulse-rd{0%,100%{box-shadow:0 0 0 0 rgba(184,90,90,.4)}50%{box-shadow:0 0 0 8px rgba(184,90,90,0)}}
        .voice-btn .wave{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);display:flex;gap:2px;align-items:flex-end;height:10px}
        .voice-btn .wave span{width:3px;background:var(--rd);border-radius:1px;animation:wave .6s infinite ease-in-out}
        .voice-btn .wave span:nth-child(1){animation-delay:0s}.voice-btn .wave span:nth-child(2){animation-delay:.1s}.voice-btn .wave span:nth-child(3){animation-delay:.2s}.voice-btn .wave span:nth-child(4){animation-delay:.3s}
        @keyframes wave{0%,100%{height:3px}50%{height:10px}}
        .cam-panel{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:2000;display:none;flex-direction:column;align-items:center;justify-content:center}
        .cam-panel.open{display:flex}
        .cam-panel video{width:100%;max-width:640px;max-height:60vh;object-fit:cover;border-radius:12px;background:#000}
        .cam-panel .cam-captured{position:relative;display:inline-block}
        .cam-panel .cam-captured img{max-width:100%;max-height:55vh;object-fit:contain;border-radius:12px}
        .cam-panel .cam-bar{display:flex;gap:12px;margin-top:20px;align-items:center}
        .cam-panel .cam-bar button{padding:12px 24px;border-radius:12px;border:none;font-size:.9rem;font-weight:700;cursor:pointer;font-family:var(--fb);transition:all .2s}
        .cam-panel .cam-snap{width:64px;height:64px;border-radius:50%;background:var(--gold);border:4px solid rgba(255,255,255,.3);cursor:pointer;transition:all .15s;margin-top:16px}
        .cam-panel .cam-snap:active{transform:scale(.9);background:#b89a3e}
        .cam-panel .cam-switch{position:absolute;top:20px;right:20px;background:rgba(255,255,255,.15);border:none;color:#fff;padding:10px 16px;border-radius:20px;cursor:pointer;font-size:.85rem;font-family:var(--fb)}
        .cam-panel .cam-close{position:absolute;top:20px;left:20px;background:none;border:none;color:#fff;font-size:1.6rem;cursor:pointer;padding:8px}
        .cam-panel .cam-flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:2001}
        .cam-panel .cam-flash.fire{animation:flash .2s ease}
        @keyframes flash{0%{opacity:.8}100%{opacity:0}}

        /* Safe area for notch phones */
        .app{padding-top:env(safe-area-inset-top,24px);padding-bottom:calc(80px + env(safe-area-inset-bottom,0px))}
        .go-btn{padding-left:calc(16px + env(safe-area-inset-left,0px));padding-right:calc(16px + env(safe-area-inset-right,0px))}

        /* Hidden */
        .hf{display:none}

        /* Mobile responsive */
        @media(max-width:640px){
            .app{padding:14px 12px 50px;padding-top:calc(14px + env(safe-area-inset-top,0px))}
            .logo{font-size:1.8rem;letter-spacing:2px}
            .sub{font-size:.65rem;letter-spacing:3px}
            .desc{font-size:.82rem;margin-top:10px;line-height:1.7}
            .cbtn{position:static;display:inline-block;margin-bottom:16px;padding:8px 18px}
            .hd{margin-bottom:20px;padding:16px 0 12px;text-align:left}
            .hd .desc{text-align:left}
            .hd .logo,.hd .sub{text-align:left}
            .input-area{padding:16px;border-radius:12px;margin-bottom:16px}
            .input-main{min-height:120px;font-size:.9rem;padding:12px}
            .input-tools{gap:6px;margin-top:10px}
            .tool-btn{padding:8px 12px;font-size:.76rem;border-radius:16px;flex-shrink:0}
            .go-btn{margin-top:14px;font-size:.9rem;padding:12px 20px;border-radius:10px}
            .attachments{gap:6px;margin-top:8px}
            .att{padding:6px 10px;font-size:.78rem;border-radius:8px}
            .att img{width:34px;height:34px;border-radius:4px}
            .output{border-radius:12px}
            .out-h{padding:10px 14px;flex-wrap:wrap;gap:8px}
            .out-h span{font-size:.7rem}
            .out-b{padding:16px;max-height:70vh;font-size:.85rem;line-height:1.8}
            .md h1{font-size:1.15rem}.md h2{font-size:1.05rem}.md h3{font-size:.92rem}
            .mc{padding:24px 20px;border-radius:14px;max-height:90vh;overflow-y:auto}
            .mc h3{font-size:1.15rem}
            .sg{margin-bottom:14px}
            .si,.ss{padding:10px 12px;font-size:.85rem}
            .modal-actions{flex-direction:row}
            .ft{font-size:.65rem;padding:30px 0 0;margin-top:30px}
        }
        @media(max-width:380px){
            .logo{font-size:1.5rem}
            .tool-btn{padding:6px 10px;font-size:.72rem}
            .go-btn{font-size:.85rem;padding:10px 16px}
        }

        /* WeChat in-app browser fixes */
        body.wechat-env .app{padding-bottom:calc(80px + env(safe-area-inset-bottom,0px) + 48px)}
        body.wechat-env .go-btn{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom,0px) + 44px);left:16px;right:16px;width:auto;z-index:50;margin-top:0;box-shadow:0 -4px 20px rgba(0,0,0,.5)}
        body.wechat-env .output{margin-bottom:80px}
        body.wechat-env .input-area{margin-bottom:80px}
        @media(max-width:640px){
            body.wechat-env .app{padding-bottom:calc(50px + env(safe-area-inset-bottom,0px) + 44px)}
            body.wechat-env .go-btn{bottom:calc(8px + env(safe-area-inset-bottom,0px) + 44px);left:12px;right:12px}
        }

        /* WeChat keyboard fix for iOS */
        @supports(-webkit-touch-callout:none){
            body.wechat-env .input-main{transform:translateZ(0)}
        }
    </style>
</head>
<body>
<div class="app">
    <!-- Settings -->
    <div class="mo" id="modal">
        <div class="mc" style="position:relative">
            <button onclick="closeMo()" style="position:absolute;top:14px;right:16px;background:none;border:none;color:var(--tx2);font-size:1.4rem;cursor:pointer">&times;</button>
            <h3>⚙️ AI 配置</h3>
            <p>数据仅保存在浏览器本地，不上传任何服务器。</p>
            <div class="sg"><label>服务商</label>
                <select class="ss" id="cfg-prov" onchange="onProv()">
                    <optgroup label="国内">
                        <option value="deepseek">DeepSeek（推荐·性价比高）</option>
                        <option value="zhipu">智谱 GLM</option>
                        <option value="qwen">通义千问（阿里云）</option>
                        <option value="moonshot">Moonshot（月之暗面·Kimi）</option>
                        <option value="yi">零一万物（Yi）</option>
                        <option value="baichuan">百川智能</option>
                        <option value="minimax">MiniMax</option>
                        <option value="stepfun">阶跃星辰（Step）</option>
                        <option value="siliconflow">SiliconFlow（硅基流动）</option>
                        <option value="doubao">豆包（火山引擎）</option>
                    </optgroup>
                    <optgroup label="海外">
                        <option value="openai">OpenAI (GPT-4o)</option>
                        <option value="anthropic">Anthropic (Claude)</option>
                        <option value="google">Google (Gemini)</option>
                        <option value="mistral">Mistral</option>
                        <option value="cohere">Cohere</option>
                        <option value="openrouter">OpenRouter（多模型聚合）</option>
                        <option value="together">Together AI</option>
                        <option value="fireworks">Fireworks AI</option>
                    </optgroup>
                    <optgroup label="Azure / 云">
                        <option value="azure">Azure OpenAI</option>
                        <option value="aliyun">阿里云百炼</option>
                        <option value="tencent">腾讯混元</option>
                        <option value="baidu">百度文心</option>
                    </optgroup>
                    <optgroup label="自部署">
                        <option value="ollama">Ollama（本地模型）</option>
                        <option value="lmstudio">LM Studio</option>
                        <option value="custom">自定义 API</option>
                    </optgroup>
                </select>
            </div>
            <div class="sg"><label>模型</label>
                <select class="ss" id="cfg-model-sel" onchange="onModelSel()" style="margin-bottom:6px"></select>
                <input class="si" id="cfg-model" placeholder="或手动输入模型名称" style="margin-top:4px">
                <div class="sh" id="model-hint">选择服务商后可快速选择模型，也可手动输入</div>
            </div>
            <div class="sg"><label>API Key</label><input type="password" class="si" id="cfg-key" placeholder="sk-..."></div>
            <div class="sg" id="sg-url" style="display:none"><label>Base URL</label><input class="si" id="cfg-url" placeholder="https://api.example.com/v1"></div>
            <div class="sr" style="margin-top:18px">
                <button class="bt" id="btn-test" onclick="testConn()">测试连接</button>
                <div><span class="sd off" id="s-dot"></span><span class="st" id="s-txt">未测试</span></div>
            </div>
            <div style="margin-top:20px;display:flex;gap:10px;justify-content:flex-end">
                <button onclick="closeMo()" style="padding:9px 16px;border-radius:8px;background:transparent;color:var(--tx2);border:1px solid var(--bd);cursor:pointer;font-family:var(--fb);font-size:.82rem">取消</button>
                <button onclick="saveCfg()" style="padding:9px 16px;border-radius:8px;background:var(--gold);color:var(--bg);border:none;font-weight:700;cursor:pointer;font-family:var(--fb);font-size:.82rem">保存</button>
            </div>
        </div>
    </div>

    <!-- Header -->
    <header class="hd">
        <button class="cbtn" onclick="openMo()"><span class="d off" id="h-dot"></span><span id="h-txt">配置 AI</span></button>
        <div class="logo">商人之眼</div>
        <div class="sub">AI 商业分析引擎</div>
        <p class="desc">输入任何商业观察——广告、店铺、抱怨、商品、消费、新闻、图片、链接——AI 自动运行全套思维框架，输出完整深度解读。</p>
    </header>

    <!-- Unified Input -->
    <div class="input-area" id="input-area">
        <textarea class="input-main" id="main-input" placeholder="描述你看到的商业现象...&#10;&#10;支持：文字、语音、拍照、图片、链接等。&#10;例如：&#10;· 一条广告的画面和文案&#10;· 一家店铺的观察&#10;· 朋友的一句抱怨&#10;· 一笔消费的决策&#10;· 一条商业新闻&#10;· https://...（粘贴链接）"></textarea>
        <div class="attachments" id="att-box"></div>
        <div class="input-tools">
            <button class="tool-btn voice-btn" id="voice-btn" onclick="toggleVoice()"><span id="voice-icon">🎤</span> <span id="voice-label">语音输入</span></button>
            <button class="tool-btn" onclick="openCam()">📷 拍照</button>
            <button class="tool-btn" onclick="document.getElementById('f-img').click()">🖼️ 图片</button>
            <button class="tool-btn" onclick="addLink()">🔗 链接</button>
            <button class="tool-btn" onclick="addVideo()">🎬 视频</button>
            <input type="file" id="f-img" class="hf" accept="image/*" multiple onchange="onImgUpload(event)">
        </div>
        <button class="go-btn" id="go-btn" onclick="run()">🚀 运行全维分析</button>
    </div>

    <!-- Camera Panel -->

async function callAI(messages,onChunk,onDone,onErr){
    if(!cfg.key){onErr('请先配置 AI API Key（右上角）');return}
    ac=new AbortController();

    // Check if we have images - if so, need vision model
    const hasImages=attachments.some(a=>a.type==='image');

    // Build request body
    const body={
        model:cfg.model,
        messages:messages,
        stream:true,
        max_tokens:8000,
        temperature:0.7
    };

    try{
        const r=await fetch(baseUrl()+'chat/completions',{
            method:'POST',
            headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.key},
            body:JSON.stringify(body),
            signal:ac.signal
        });
        if(!r.ok){
            const e=await r.json().catch(()=>({}));
            let errMsg=e.error?.message||r.status+'';
            // If vision error with non-vision model, suggest model change
            if(hasImages && errMsg.includes('vision')||errMsg.includes('image')){
                errMsg+='\n\n💡 提示：发送图片需要视觉模型。请将模型改为 gpt-4o、claude-3.5-sonnet 或其他支持图片的模型。';
            }
            onErr('API 错误: '+errMsg);return;
        }
        const reader=r.body.getReader();
        const dec=new TextDecoder();
        let buf='',full='';
        while(true){
            const{done,value}=await reader.read();
            if(done)break;
            buf+=dec.decode(value,{stream:true});
            const lines=buf.split('\n');buf=lines.pop()||'';
            for(const l of lines){
                const t=l.trim();
                if(!t.startsWith('data:'))continue;
                const d=t.slice(5).trim();
                if(d==='[DONE]')continue;
                try{const j=JSON.parse(d);const c=j.choices?.[0]?.delta?.content||'';if(c){full+=c;onChunk(full)}}catch(e){}
            }
        }
        onDone(full);
    }catch(e){
        if(e.name==='AbortError')onErr('已取消');
        else onErr('网络错误: '+e.message);
    }
}

function renderMd(text){
    return text
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/^#### (.+)$/gm,'<h4>$1</h4>')
        .replace(/^### (.+)$/gm,'<h3>$1</h3>')
        .replace(/^## (.+)$/gm,'<h2>$1</h2>')
        .replace(/^# (.+)$/gm,'<h1>$1</h1>')
        .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
        .replace(/\*(.+?)\*/g,'<em>$1</em>')
        .replace(/`([^`]+)`/g,'<code>$1</code>')
        .replace(/^> (.+)$/gm,'<blockquote><p>$1</p></blockquote>')
        .replace(/^---$/gm,'<hr>')
        .replace(/^[•●■□☑☒] (.+)$/gm,'<li>$1</li>')
        .replace(/^(\d+)[.、)】] (.+)$/gm,'<li>$2</li>')
        .replace(/^- \[([ xX])\] (.+)$/gm,(m,c,t)=>`<li><input type="checkbox" ${c.toLowerCase()==='x'?'checked':''} disabled> ${t}</li>`)
        .replace(/\n{2,}/g,'</p><p>')
        .replace(/\n/g,'<br>')
        .replace(/^/,'<p>').replace(/$/,'</p>')
        .replace(/<p><(h[1-4]|blockquote|li|hr)/g,'<$1')
        .replace(/<\/(blockquote|li)><\/p>/g,'</$1>')
        .replace(/<p><\/p>/g,'');
}

// ==================== RUN ====================
async function run(){
    const text=$('main-input').value.trim();
    if(!text && attachments.length===0){alert('请先输入内容或添加图片/链接');return}

    const out=$('output'),body=$('out-body'),btn=$('go-btn');
    out.classList.add('show');
    body.innerHTML='<div class="ld"><div class="ld-d"><span></span><span></span><span></span></div><div><div>AI 正在分析中...</div><div class="ld-t" id="tmr">0秒</div></div></div>';
    btn.disabled=true;btn.textContent='⏳ 分析中...';

    const t0=Date.now();
    const ti=setInterval(()=>{const el=$('tmr');if(el)el.textContent=((Date.now()-t0)/1000|0)+'秒'},1000);

    // Decide: use vision API or text API
    const hasImages=attachments.some(a=>a.type==='image');
    let messages;

    if(hasImages){
        // Use vision format
        const content=[];
        if(text) content.push({type:'text',text:buildFullPrompt()});
        // Rebuild prompt without image descriptions for the text part
        const promptText=buildFullPrompt();
        // Replace image descriptions with actual image data
        const userContent=[{type:'text',text:promptText}];
        attachments.filter(a=>a.type==='image').forEach(a=>{
            userContent.push({type:'image_url',image_url:{url:a.data}});
        });
        messages=[
            {role:'system',content:'你是一位融合广告心理学、商业模式诊断、用户思维、财务分析和信息判断的顶级商业分析师——"商人之眼"。请按照用户要求的框架进行深度分析。逐项展开，每项都有"分析过程→结论"。用具体数字和场景论证，给出可直接行动的建议。用Markdown格式输出。'},
            {role:'user',content:userContent}
        ];
    }else{
        messages=[
            {role:'system',content:'你是一位融合广告心理学、商业模式诊断、用户思维、财务分析和信息判断的顶级商业分析师——"商人之眼"。请按照用户要求的框架进行深度分析。逐项展开，每项都有"分析过程→结论"。用具体数字和场景论证，给出可直接行动的建议。用Markdown格式输出。'},
            {role:'user',content:buildFullPrompt()}
        ];
    }

    callAI(
        messages,
        (t)=>{body.innerHTML=renderMd(t);body.scrollTop=body.scrollHeight},
        (full)=>{
            clearInterval(ti);
            const s=((Date.now()-t0)/1000|0);
            body.innerHTML=renderMd(full)+`<div style="text-align:right;color:var(--tx3);font-size:.72rem;margin-top:14px;padding-top:10px;border-top:1px solid var(--bd)">分析完成 · ${s}秒 · 商人之眼</div>`;
            body.scrollTop=body.scrollHeight;
            btn.disabled=false;btn.textContent='🔄 重新分析';
        },
        (err)=>{
            clearInterval(ti);
            body.innerHTML=`<div style="text-align:center;padding:30px;color:var(--rd)">${err}</div><div style="text-align:center;margin-top:14px"><button class="tool-btn" onclick="openMo()">⚙️ 配置 AI</button></div>`;
            btn.disabled=false;btn.textContent='🚀 运行全维分析';
        }
    );
    out.scrollIntoView({behavior:'smooth',block:'nearest'});
}

// ==================== CAMERA ====================
let camStream=null,camFacing='environment',snapData='';

async function openCam(){
    $('cam-panel').classList.add('open');
    $('cam-live').style.display='block';
    $('cam-preview').style.display='none';
    try{
        camStream=await navigator.mediaDevices.getUserMedia({
            video:{facingMode:camFacing,width:{ideal:1280},height:{ideal:960}},
            audio:false
        });
        $('cam-video').srcObject=camStream;
        $('cam-hint').textContent='点击圆圈拍照';
    }catch(e){
        $('cam-hint').textContent='无法访问相机: '+e.message;
        $('cam-hint').style.color='var(--rd)';
    }
}
function closeCam(){
    $('cam-panel').classList.remove('open');
    if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null}
    $('cam-video').srcObject=null;
}
async function switchCam(){
    camFacing=camFacing==='environment'?'user':'environment';
    if(camStream){camStream.getTracks().forEach(t=>t.stop())}
    try{
        camStream=await navigator.mediaDevices.getUserMedia({
            video:{facingMode:camFacing,width:{ideal:1280},height:{ideal:960}},
            audio:false
        });
        $('cam-video').srcObject=camStream;
    }catch(e){
        $('cam-hint').textContent='切换失败: '+e.message;
    }
}
function snapPhoto(){
    if(!camStream)return;
    const v=$('cam-video'),canvas=document.createElement('canvas');
    canvas.width=v.videoWidth||640;canvas.height=v.videoHeight||480;
    const ctx=canvas.getContext('2d');ctx.drawImage(v,0,0);
    snapData=canvas.toDataURL('image/jpeg',0.85);
    // Flash effect
    const fl=$('cam-flash');fl.classList.remove('fire');void fl.offsetWidth;fl.classList.add('fire');
    // Show preview
    $('cam-live').style.display='none';
    $('cam-preview').style.display='block';
    $('cam-img').src=snapData;
}
function confirmSnap(){
    if(snapData){
        attachments.push({type:'image',data:snapData,name:'拍照_'+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',second:'2-digit'})+'.jpg'});
        renderAtt();
    }
    closeCam();
}
function discardSnap(){snapData='';closeCam()}
function retakeSnap(){
    snapData='';$('cam-preview').style.display='none';$('cam-live').style.display='block';
}

// ==================== VOICE INPUT ====================
let voiceRec=null,isRec=false;

function toggleVoice(){
    const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SpeechRecognition){
        // Fallback: use native input with speech attribute
        if(!document.getElementById('f-voice')){
            const inp=document.createElement('input');
            inp.id='f-voice';inp.type='file';inp.accept='audio/*';inp.capture='microphone';
            inp.style.display='none';inp.className='hf';
            inp.onchange=function(e){
                if(e.target.files[0]){
                    const url=URL.createObjectURL(e.target.files[0]);
                    attachments.push({type:'video',data:url,name:'语音_'+e.target.files[0].name});
                    renderAtt();
                    $('main-input').value+='[已录制语音，需AI转录分析]\n';
                }
                e.target.value='';
            };
            document.body.appendChild(inp);
        }
        document.getElementById('f-voice').click();
        return;
    }

    if(isRec){stopVoice();return}
    voiceRec=new SpeechRecognition();
    voiceRec.lang='zh-CN';
    voiceRec.continuous=true;
    voiceRec.interimResults=true;
    voiceRec.maxAlternatives=1;

    const ta=$('main-input');
    const origVal=ta.value;
    const cursorPos=ta.selectionStart;

    voiceRec.onstart=()=>{
        isRec=true;
        const btn=$('voice-btn');btn.classList.add('rec');
        $('voice-icon').textContent='⏹️';$('voice-label').textContent='录音中';
    };
    voiceRec.onresult=(e)=>{
        let interim='',final_='';
        for(let i=e.resultIndex;i<e.results.length;i++){
            const t=e.results[i][0].transcript;
            if(e.results[i].isFinal) final_+=t;
            else interim+=t;
        }
        // Append final results to textarea
        if(final_){
            ta.value+=final_;
        }
        // Show interim in label
        $('voice-label').textContent=interim||'录音中...';
    };
    voiceRec.onerror=(e)=>{
        console.warn('Voice error:',e.error);
        if(e.error==='not-allowed'){
            alert('请允许麦克风权限后重试');
        }
        stopVoice();
    };
    voiceRec.onend=()=>{
        // Auto-restart if still recording (continuous mode may stop)
        if(isRec){
            try{voiceRec.start()}catch(e){stopVoice()}
        }
    };

    try{voiceRec.start()}catch(e){alert('语音启动失败: '+e.message)}
}

function stopVoice(){
    isRec=false;
    if(voiceRec){voiceRec.abort();voiceRec=null}
    const btn=$('voice-btn');btn.classList.remove('rec');
    $('voice-icon').textContent='🎤';$('voice-label').textContent='语音输入';
}

// Auto-detect paste of image
document.addEventListener('paste',e=>{
    const items=e.clipboardData?.items;
    if(!items)return;
    for(const item of items){
        if(item.type.startsWith('image/')){
            e.preventDefault();
            const f=item.getAsFile();
            const r=new FileReader();
            r.onload=()=>{attachments.push({type:'image',data:r.result,name:'粘贴的图片'});renderAtt()};
            r.readAsDataURL(f);
        }
    }
});

// Drag and drop
const ia=$('input-area');
ia.addEventListener('dragover',e=>{e.preventDefault();ia.style.borderColor='var(--gold)'});
ia.addEventListener('dragleave',()=>{ia.style.borderColor='var(--bd)'});
ia.addEventListener('drop',e=>{
    e.preventDefault();ia.style.borderColor='var(--bd)';
    const files=e.dataTransfer.files;
    for(const f of files){
        if(f.type.startsWith('image/')){
            const r=new FileReader();
            r.onload=()=>{attachments.push({type:'image',data:r.result,name:f.name});renderAtt()};
            r.readAsDataURL(f);
        }
    }
});
